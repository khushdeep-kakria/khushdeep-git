<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
    <stop stop-color="#09090B"/>
    <stop offset="1" stop-color="#18181B"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22C55E"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>

<!-- Subtle grid -->
<g opacity="0.07" stroke="#A1A1AA">
  <path d="M0 80H1200"/>
  <path d="M0 160H1200"/>
  <path d="M0 240H1200"/>
  <path d="M120 0V320"/>
  <path d="M240 0V320"/>
  <path d="M360 0V320"/>
  <path d="M480 0V320"/>
  <path d="M600 0V320"/>
  <path d="M720 0V320"/>
  <path d="M840 0V320"/>
  <path d="M960 0V320"/>
  <path d="M1080 0V320"/>
</g>

<!-- Terminal window -->
<g transform="translate(720 55)">

  <rect width="390" height="210" rx="12"
        fill="#09090B"
        stroke="#27272A"
        stroke-width="2"/>

  <!-- Terminal header -->
  <rect width="390" height="35" rx="12" fill="#18181B"/>
  <circle cx="20" cy="18" r="5" fill="#52525B"/>
  <circle cx="38" cy="18" r="5" fill="#52525B"/>
  <circle cx="56" cy="18" r="5" fill="#52525B"/>

  <!-- Commands -->
  <text x="25" y="72"
        fill="#22C55E"
        font-family="monospace"
        font-size="15">
    $ git push origin main
  </text>

  <text x="25" y="101"
        fill="#06B6D4"
        font-family="monospace"
        font-size="15">
    $ docker build -t app .
  </text>

  <text x="25" y="130"
        fill="#A1A1AA"
        font-family="monospace"
        font-size="15">
    $ kubectl apply -f deployment.yaml
  </text>

  <text x="25" y="159"
        fill="#22C55E"
        font-family="monospace"
        font-size="15">
    ✓ deployment successful
  </text>

  <text x="25" y="188"
        fill="#71717A"
        font-family="monospace"
        font-size="13">
    pipeline: completed
  </text>

</g>

<!-- Pipeline nodes -->

<g filter="url(#glow)">

  <!-- Connecting line -->
  <path d="M550 105H650V145H720"
        stroke="url(#line)"
        stroke-width="2"
        stroke-dasharray="6 6"/>

  <path d="M550 160H650V145"
        stroke="url(#line)"
        stroke-width="2"
        stroke-dasharray="6 6"/>

  <path d="M550 215H650V145"
        stroke="url(#line)"
        stroke-width="2"
        stroke-dasharray="6 6"/>

  <!-- Nodes -->
  <circle cx="550" cy="105" r="7" fill="#22C55E"/>
  <circle cx="550" cy="160" r="7" fill="#06B6D4"/>
  <circle cx="550" cy="215" r="7" fill="#22C55E"/>

</g>

<!-- Main text -->

<text x="75" y="105"
      fill="#FAFAFA"
      font-family="Arial, Helvetica, sans-serif"
      font-size="48"
      font-weight="700">
  KHUSHDEEP KAKRIA
</text>

<text x="78" y="150"
      fill="#22C55E"
      font-family="Arial, Helvetica, sans-serif"
      font-size="22"
      font-weight="600">
  DEVOPS ENGINEER
</text>

<text x="78" y="184"
      fill="#A1A1AA"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16">
  AWS • Linux • Docker • Kubernetes • Terraform
</text>

<!-- Accent -->
<rect x="78" y="208" width="360" height="3"
      rx="2"
      fill="url(#line)"/>

<text x="78" y="245"
      fill="#71717A"
      font-family="monospace"
      font-size="14">
  CODE → BUILD → DEPLOY → AUTOMATE
</text>

</svg>